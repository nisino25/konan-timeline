<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d13">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>名探偵コナン 見どころ</title>
<style>
  :root {
    --bg: #0b0d13;
    --panel: #10131c;
    --ink: #ece7dc;
    --mute: #8189a0;
    --faint: #4a5167;
    --line: #232939;
    --gold: #d6a24a;
    --t1: #f2c14e;
    --t2: #6fb3d9;
    --t3: #ff4a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 72px; }
  header { padding-top: 24px; }
  h1 {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-weight: 600;
    font-size: 1.6rem;
  }

  /* tier tabs */
  .tiers { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 6px; }
  .tiers button {
    font: inherit;
    font-size: 0.86rem;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--mute);
    cursor: pointer;
  }
  .tiers button .bar { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .tiers button[aria-selected="true"] { color: #1a1410; background: linear-gradient(180deg, #e6b860, #d6a24a); border-color: transparent; font-weight: 600; }
  .tiers button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .count { color: var(--faint); font-size: 0.8rem; margin: 6px 0 0; }

  /* year heading */
  .year {
    margin: 26px 0 8px;
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-size: 1.1rem;
    color: var(--gold);
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .year::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  /* one episode per row */
  .ep {
    display: grid;
    grid-template-columns: 74px 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-left: 5px solid var(--chip);
    border-radius: 8px;
    background: var(--panel);
    margin-bottom: 6px;
  }
  .ep.t1 { --chip: var(--t1); }
  .ep.t2 { --chip: var(--t2); }
  .ep.t3 { --chip: var(--t3); }
  .no { font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif; color: var(--mute); font-size: 0.86rem; font-variant-numeric: tabular-nums; }
  .name { font-size: 0.94rem; min-width: 0; }
  /* tier label on each row, so the tier is readable in the all tab too */
  .tg { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: #1a1410; vertical-align: 1px; white-space: nowrap; }
  .tg.t1 { background: var(--t1); }
  .tg.t2 { background: var(--t2); }
  .tg.t3 { background: var(--t3); color: #fff; }
  /* the first episode after the one you are on */
  .ep.next { outline: 2px solid var(--gold); outline-offset: 3px; }
  /* watched-up-to picker in the nav */
  .prog { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #8189a0; white-space: nowrap; }
  .prog input { width: 70px; padding: 4px 6px; background: #10131c; color: #ece7dc; border: 1px solid #232939; border-radius: 6px; font: inherit; font-size: 16px; }
  .air { color: var(--faint); font-size: 0.78rem; white-space: nowrap; }
  .msg { color: var(--mute); padding: 20px 0; }
  .note { color: var(--faint); font-size: 0.8rem; margin-top: 22px; }

  @media (max-width: 640px) {
    .ep { grid-template-columns: 60px 1fr; }
    .air { grid-column: 2; }
    .name { font-size: 0.88rem; }
  }

  /* shared navigation bar, the same on every page */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 12px 20px;
    background: rgba(11, 13, 19, 0.94);
    border-bottom: 1px solid #232939;
    box-shadow: 0 10px 22px -14px rgba(0, 0, 0, 0.95);
    font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, sans-serif;
  }
  .site-nav .brand {
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #d6a24a;
    text-decoration: none;
  }
  .site-links { display: flex; flex-wrap: wrap; gap: 4px; }
  .site-links a {
    padding: 6px 12px;
    border-radius: 6px;
    color: #8189a0;
    text-decoration: none;
    font-size: 0.86rem;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .site-links a:hover { color: #ece7dc; background: rgba(255, 255, 255, 0.04); }
  .site-links a.current {
    color: #1a1410;
    font-weight: 600;
    background: linear-gradient(180deg, #e6b860, #d6a24a);
  }
  .site-links a:focus-visible { outline: 2px solid #d6a24a; outline-offset: 2px; }
</style>
</head>
<body>
  <nav class="site-nav" aria-label="ページ">
    <a class="brand" href="index.html">Konan</a>
    <div class="site-links">
      <a href="index.html">年表</a>
      <a href="ratings.html">評価</a>
      <a href="tiers.html" class="current" aria-current="page">見どころ</a>
      <a href="words.html">単語</a>
      <a href="stats.html">統計</a>
      <a href="songs.html">主題歌</a>
    </div>
    <label class="prog">見た話 <input type="number" id="progInput" min="1" max="1218" inputmode="numeric" placeholder="全部"> 話まで</label>
  </nav>
<div class="wrap">

  <header>
    <h1>見どころ</h1>
  </header>

  <div class="tiers" role="tablist" aria-label="見どころの段階">
    <button type="button" role="tab" data-tier="1" aria-selected="false"><span class="bar" style="background: var(--t1)"></span>tier1</button>
    <button type="button" role="tab" data-tier="2" aria-selected="false"><span class="bar" style="background: var(--t2)"></span>tier2</button>
    <button type="button" role="tab" data-tier="3" aria-selected="false"><span class="bar" style="background: var(--t3)"></span>tier3</button>
    <button type="button" role="tab" data-tier="all" aria-selected="true">all</button>
  </div>
  <p class="count" id="count"></p>

  <div id="list"><p class="msg">読み込み中…</p></div>

  <p class="note">放送情報は各話の放送日（TMDB）に基づきます。</p>
</div>

<script>
  (function () {
    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    Promise.all([
      fetch('data/episodes.json').then(function (r) { if (!r.ok) throw new Error(); return r.json(); }),
      fetch('data/tiers.json').then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    ]).then(function (res) {
      var byNum = {};
      res[0].conan.forEach(function (e) { byNum[e.e] = e; });
      var tiers = res[1];

      // episodes per tier, in broadcast order
      var lists = { 1: [], 2: [], 3: [] };
      Object.keys(tiers).forEach(function (n) {
        var e = byNum[+n];
        if (e && lists[tiers[n]]) lists[tiers[n]].push(e);
      });
      Object.keys(lists).forEach(function (t) { lists[t].sort(function (a, b) { return a.e - b.e; }); });
      // all: tier2 and tier3 episodes in broadcast order, each keeping its own tier colour
      lists.all = lists[2].concat(lists[3]).sort(function (a, b) { return a.e - b.e; });

      var list = document.getElementById('list');
      var count = document.getElementById('count');

      function show(t) {
        var year = null;
        var html = '';
        lists[t].forEach(function (e) {
          var y = (e.air || '').slice(0, 4) || '—';
          if (y !== year) { year = y; html += '<div class="year">' + y + '</div>'; }
          var tt = t === 'all' ? tiers[e.e] : t;
          html += '<div class="ep t' + tt + '" data-e="' + e.e + '">' +
            '<span class="no">第' + e.e + '話</span>' +
            '<span class="name">' + esc(e.name) + '<span class="tg t' + tt + '">tier' + tt + '</span></span>' +
            '<span class="air">' + esc(e.air) + '</span>' +
          '</div>';
        });
        list.innerHTML = html || '<p class="msg">まだありません。</p>';
        count.textContent = lists[t].length + '話';

        // scroll to the first episode after the one you are on (if a progress is set)
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var cur = window.konanProgress();
        var up = Array.prototype.find.call(list.querySelectorAll('.ep'), function (r) { return +r.dataset.e > cur; });
        if (up) {
          up.classList.add('next');
          var nav = document.querySelector('.site-nav');
          var top = up.getBoundingClientRect().top + window.pageYOffset - (nav ? nav.offsetHeight : 0) - 12;
          window.scrollTo(0, Math.max(0, top));
        }
      }

      document.querySelectorAll('.tiers button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tiers button').forEach(function (b) {
            b.setAttribute('aria-selected', String(b === btn));
          });
          show(btn.dataset.tier);
        });
      });
      show('all');
    }).catch(function () {
      document.getElementById('list').innerHTML = '<p class="msg">データが読み込めませんでした。</p>';
    });
  })();
</script>
<script>
  // watched-up-to episode: saved on this device only; empty = no spoiler lock
  (function () {
    var KEY = 'konan-progress', ALL = 1218;
    window.konanProgress = function () {
      try { var v = parseInt(localStorage.getItem(KEY), 10); return v > 0 ? v : ALL; } catch (e) { return ALL; }
    };
    var input = document.getElementById('progInput');
    if (!input) return;
    input.value = window.konanProgress() >= ALL ? '' : window.konanProgress();
    input.addEventListener('change', function () {
      var v = parseInt(input.value, 10);
      try { if (v > 0) localStorage.setItem(KEY, String(Math.min(v, ALL))); else localStorage.removeItem(KEY); } catch (e) {}
      location.reload();
    });
  })();
</script>
<script>if (/^(localhost|127[.]0[.]0[.]1)$/.test(location.hostname)) { var last = null; setInterval(function () { var f = location.pathname.endsWith('/') ? 'index.html' : location.pathname.split('/').pop(); fetch(f, { method: 'HEAD', cache: 'no-store' }).then(function (r) { var m = r.headers.get('last-modified'); if (last && m !== last) location.reload(); last = m; }).catch(function () {}); }, 1000); }</script>
</body>
</html>
