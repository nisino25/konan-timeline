<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d13">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>名探偵コナン 主題歌年表</title>
<style>
  :root {
    --bg: #0b0d13;
    --panel: #10131c;
    --ink: #ece7dc;
    --mute: #8189a0;
    --faint: #4a5167;
    --line: #232939;
    --gold: #d6a24a;
    --ed: #6fb3d9;
    --red: #ff4a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 72px; }
  header { padding-top: 24px; }
  h1 {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-weight: 600;
    font-size: 1.6rem;
  }
  .sub { margin: 4px 0 0; color: var(--mute); font-size: 0.85rem; }

  /* year heading */
  .year {
    margin: 30px 0 12px;
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-size: 1.2rem;
    color: var(--gold);
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .year::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  /* one row per song, in broadcast order: episode outside the card, OP left, ED right */
  .pair {
    display: grid;
    grid-template-columns: 1fr 64px 1fr;
    gap: 14px;
    align-items: start;
    margin-bottom: 8px;
  }
  .pair.head { margin-bottom: 6px; }
  .col-h {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
  }
  .op-h { color: var(--gold); }
  .ed-h { color: var(--ed); }
  .epout {
    padding-top: 14px;
    text-align: center;
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-size: 0.9rem;
    color: var(--mute);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .col { min-width: 0; }
  .empty { min-height: 1px; }

  .song {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    border-left: 3px solid var(--chip, var(--gold));
  }
  .song.op { --chip: var(--gold); }
  .song.ed { --chip: var(--ed); }
  .info { min-width: 0; }
  .title { font-size: 0.98rem; font-weight: 600; line-height: 1.35; }
  .singer { font-size: 0.8rem; color: var(--mute); margin-top: 2px; }
  .yt {
    display: inline-flex;
    align-items: center;
    padding: 7px 11px;
    border-radius: 6px;
    background: var(--red);
    color: #ffffff;
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .yt:hover { filter: brightness(1.08); }
  a.song { text-decoration: none; color: inherit; cursor: pointer; transition: border-color 0.2s ease, transform 0.2s ease; }
  a.song:hover, a.song:focus-visible { border-color: var(--gold-dim); transform: translateY(-1px); outline: none; }
  .msg { color: var(--mute); padding: 20px 0; }
  .note { color: var(--faint); font-size: 0.8rem; margin-top: 22px; }

  @media (max-width: 640px) {
    .pair { grid-template-columns: 1fr 44px 1fr; gap: 6px; }
    .epout { padding-top: 12px; font-size: 0.7rem; }
    .song { grid-template-columns: 1fr; gap: 6px; padding: 8px; }
    .yt { justify-self: start; padding: 5px 8px; font-size: 0.7rem; }
    .title { font-size: 0.84rem; }
    .singer { font-size: 0.72rem; }
    .col-h { font-size: 0.62rem; }
  }

  /* shared navigation bar, the same on every page */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 12px 20px;
    background: rgba(11, 13, 19, 0.94);
    border-bottom: 1px solid #232939;
    box-shadow: 0 10px 22px -14px rgba(0, 0, 0, 0.95);
    font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, sans-serif;
  }
  .site-nav .brand {
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #d6a24a;
    text-decoration: none;
  }
  .site-links {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .site-links a {
    padding: 6px 12px;
    border-radius: 6px;
    color: #8189a0;
    text-decoration: none;
    font-size: 0.86rem;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .site-links a:hover {
    color: #ece7dc;
    background: rgba(255, 255, 255, 0.04);
  }
  .site-links a.current {
    color: #1a1410;
    font-weight: 600;
    background: linear-gradient(180deg, #e6b860, #d6a24a);
  }
  .site-links a:focus-visible {
    outline: 2px solid #d6a24a;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <nav class="site-nav" aria-label="ページ">
    <a class="brand" href="index.html">Konan</a>
    <div class="site-links">
      <a href="index.html">年表</a>
      <a href="relationships.html">相関図</a>
      <a href="ratings.html">評価</a>
      <a href="stats.html">統計</a>
      <a href="songs.html" class="current" aria-current="page">主題歌</a>
    </div>
  </nav>
<div class="wrap">

  <header>
    <h1>主題歌 年表</h1>
  </header>

  <div id="list"><p class="msg">読み込み中…</p></div>

  <p class="note">This product uses the TMDB API but is not endorsed or certified by TMDB. 曲と放送情報は日本語版Wikipediaの記載に基づきます。</p>
</div>

<script>
  (function () {
    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function ytUrl(q) {
      return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
    }

    Promise.all([
      fetch('data/songs.json').then(function (r) { if (!r.ok) throw new Error(); return r.json(); }),
      fetch('data/episodes.json').then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    ]).then(function (res) {
      var songs = res[0];
      var byNum = {};
      res[1].conan.forEach(function (e) { byNum[e.e] = e; });

      function airOf(n) { return byNum[n] ? byNum[n].air : ''; }

      function card(s) {
        var ep = byNum[s.f];
        var q = '名探偵コナン 第' + s.f + '話 ' + (ep ? ep.name : '');
        return '<a class="song ' + s.k + '" href="' + ytUrl(q) + '" target="_blank" rel="noopener">' +
          '<div class="info">' +
            '<div class="title">' + esc(s.t) + '</div>' +
            '<div class="singer">' + esc(s.a) + '</div>' +
          '</div>' +
        '</a>';
      }

      // every song in broadcast order (by its first episode, openings first on a tie)
      var rows = songs.slice().sort(function (a, b) {
        return a.f - b.f || (a.k === 'op' ? -1 : 1);
      });

      var html = '<div class="pair head">' +
        '<div class="col-h op-h">OPENING</div><div></div><div class="col-h ed-h">ENDING</div></div>';
      var year = null;
      rows.forEach(function (s) {
        var y = airOf(s.f).slice(0, 4) || '—';
        if (y !== year) {
          year = y;
          html += '<div class="year">' + y + '</div>';
        }
        html += '<div class="pair">' +
          '<div class="col">' + (s.k === 'op' ? card(s) : '<div class="empty"></div>') + '</div>' +
          '<div class="epout">EP' + s.f + '</div>' +
          '<div class="col">' + (s.k === 'ed' ? card(s) : '<div class="empty"></div>') + '</div>' +
        '</div>';
      });
      document.getElementById('list').innerHTML = html;
    }).catch(function () {
      document.getElementById('list').innerHTML = '<p class="msg">データが読み込めませんでした。</p>';
    });
  })();
</script>
<script>if (/^(localhost|127[.]0[.]0[.]1)$/.test(location.hostname)) { var last = null; setInterval(function () { var f = location.pathname.endsWith('/') ? 'index.html' : location.pathname.split('/').pop(); fetch(f, { method: 'HEAD', cache: 'no-store' }).then(function (r) { var m = r.headers.get('last-modified'); if (last && m !== last) location.reload(); last = m; }).catch(function () {}); }, 1000); }</script>
</body>
</html>
